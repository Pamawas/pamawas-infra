version: '3.8'

# Pamawas Core Infrastructure
# - PostgreSQL database
# - Pamawas services (ingest, correlator, investigator, reporter, scheduler, migrations)
#
# Observability (Prometheus, Loki, Tempo, Grafana) is EXPECTED TO EXIST EXTERNALLY.
# Configure via environment variables:
#   PROMETHEUS_URL=http://your-prometheus:9090
#   LOKI_URL=http://your-loki:3100
#   TEMPO_OTLP_ENDPOINT=your-tempo:4317
#   GRAFANA_URL=http://your-grafana:3000

services:
  # ============================================================
  # CORE INFRASTRUCTURE
  # ============================================================
  postgresql:
    image: postgres:16-alpine
    container_name: pamawas-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pamawas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pamawas}
      POSTGRES_DB: ${POSTGRES_DB:-pamawas}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pamawas} -d ${POSTGRES_DB:-pamawas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamawas-network

  pamawas-migrations:
    image: ghcr.io/pamawas/pamawas-schema:latest
    container_name: pamawas-migrations
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pamawas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pamawas}
      POSTGRES_DB: ${POSTGRES_DB:-pamawas}
      USE_EMBEDDED_MIGRATIONS: "true"
      # Optional observability (disabled if empty)
      OTEL_EXPORTER_OTLP_ENDPOINT: "${TEMPO_OTLP_ENDPOINT}"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - pamawas-network

  # ============================================================
  # APPLICATION SERVICES
  # ============================================================
  pamawas-ingest:
    image: ghcr.io/pamawas/pamawas-ingest:latest
    container_name: pamawas-ingest
    ports:
      - "8080:8080"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pamawas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pamawas}
      POSTGRES_DB: ${POSTGRES_DB:-pamawas}
      PORT: "8080"
      LOG_LEVEL: "info"
      ENVIRONMENT: "development"
      # Optional observability
      OTEL_EXPORTER_OTLP_ENDPOINT: "${TEMPO_OTLP_ENDPOINT}"
    depends_on:
      pamawas-migrations:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamawas-network

  pamawas-correlator:
    image: ghcr.io/pamawas/pamawas-correlator:latest
    container_name: pamawas-correlator
    ports:
      - "8081:8080"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pamawas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pamawas}
      POSTGRES_DB: ${POSTGRES_DB:-pamawas}
      PORT: "8080"
      CORRELATION_TIME_WINDOW: "10m"
      CORRELATION_INTERVAL: "1m"
      LOG_LEVEL: "info"
      ENVIRONMENT: "development"
      # Optional observability
      OTEL_EXPORTER_OTLP_ENDPOINT: "${TEMPO_OTLP_ENDPOINT}"
    depends_on:
      pamawas-migrations:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamawas-network

  pamawas-investigator:
    image: ghcr.io/pamawas/pamawas-investigator:latest
    container_name: pamawas-investigator
    ports:
      - "8082:8080"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pamawas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pamawas}
      POSTGRES_DB: ${POSTGRES_DB:-pamawas}
      PORT: "8080"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_API_KEY: "${LLM_API_KEY}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      MAX_TOOL_CALLS: "6"
      LOG_LEVEL: "info"
      ENVIRONMENT: "development"
      # Optional observability (used by tools)
      PROMETHEUS_URL: "${PROMETHEUS_URL}"
      LOKI_URL: "${LOKI_URL}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${TEMPO_OTLP_ENDPOINT}"
    depends_on:
      pamawas-migrations:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamawas-network

  pamawas-reporter:
    image: ghcr.io/pamawas/pamawas-reporter:latest
    container_name: pamawas-reporter
    ports:
      - "8083:8080"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pamawas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pamawas}
      POSTGRES_DB: ${POSTGRES_DB:-pamawas}
      PORT: "8080"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
      EMAIL_SMTP_HOST: "${EMAIL_SMTP_HOST}"
      EMAIL_SMTP_PORT: "${EMAIL_SMTP_PORT:-587}"
      EMAIL_USERNAME: "${EMAIL_USERNAME}"
      EMAIL_PASSWORD: "${EMAIL_PASSWORD}"
      EMAIL_FROM: "${EMAIL_FROM}"
      EMAIL_TO: "${EMAIL_TO}"
      REPORT_INTERVAL: "1h"
      LOG_LEVEL: "info"
      ENVIRONMENT: "development"
      # Optional observability
      OTEL_EXPORTER_OTLP_ENDPOINT: "${TEMPO_OTLP_ENDPOINT}"
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamawas-network

  pamawas-scheduler:
    image: ghcr.io/pamawas/pamawas-scheduler:latest
    container_name: pamawas-scheduler
    ports:
      - "8084:8080"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pamawas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pamawas}
      POSTGRES_DB: ${POSTGRES_DB:-pamawas}
      PORT: "8080"
      REPORTER_URL: "http://pamawas-reporter:8080"
      DAILY_REPORT_TIME: "07:00"
      HIGH_SEVERITY_THRESHOLD: "high"
      CHECK_INTERVAL: "30s"
      ENABLE_DAILY_REPORT: "true"
      ENABLE_HIGH_SEVERITY_ALERT: "true"
      LOG_LEVEL: "info"
      ENVIRONMENT: "development"
      # Optional observability
      OTEL_EXPORTER_OTLP_ENDPOINT: "${TEMPO_OTLP_ENDPOINT}"
    depends_on:
      postgresql:
        condition: service_healthy
      pamawas-reporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamawas-network

volumes:
  postgres-data:

networks:
  pamawas-network:
    driver: bridge