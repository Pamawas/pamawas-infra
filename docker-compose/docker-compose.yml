version: '3.8'

services:
  # ============================================================
  # INFRASTRUCTURE (User-managed in production, included for dev)
  # ============================================================
  postgresql:
    image: postgres:16-alpine
    container_name: pamawas-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pamawas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pamawas}
      POSTGRES_DB: ${POSTGRES_DB:-pamawas}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pamawas} -d ${POSTGRES_DB:-pamawas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamawas-network

  pamawas-migrations:
    build:
      context: ../../pamawas-schema
      dockerfile: Dockerfile
    container_name: pamawas-migrations
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-pamawas}:${POSTGRES_PASSWORD:-pamawas}@postgresql:5432/${POSTGRES_DB:-pamawas}?sslmode=disable"
      USE_EMBEDDED_MIGRATIONS: "true"
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamawas-network

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: pamawas-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamawas-network

  loki:
    image: grafana/loki:2.9.0
    container_name: pamawas-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamawas-network

  tempo:
    image: grafana/tempo:2.4.0
    container_name: pamawas-tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
      - "9411:9411"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    command: -config.file=/etc/tempo.yaml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamawas-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pamawas-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamawas-network

  # ============================================================
  # PAMAWAS APPLICATION SERVICES
  # ============================================================
  pamawas-ingest:
    build:
      context: ../../pamawas-ingest
      dockerfile: Dockerfile
    container_name: pamawas-ingest
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-pamawas}:${POSTGRES_PASSWORD:-pamawas}@postgresql:5432/${POSTGRES_DB:-pamawas}?sslmode=disable"
      PORT: "8080"
      LOG_LEVEL: "info"
      ENVIRONMENT: "development"
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
    depends_on:
      pamawas-migrations:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamawas-network

  pamawas-correlator:
    build:
      context: ../../pamawas-correlator
      dockerfile: Dockerfile
    container_name: pamawas-correlator
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-pamawas}:${POSTGRES_PASSWORD:-pamawas}@postgresql:5432/${POSTGRES_DB:-pamawas}?sslmode=disable"
      PORT: "8080"
      CORRELATION_TIME_WINDOW: "10m"
      CORRELATION_INTERVAL: "1m"
      LOG_LEVEL: "info"
      ENVIRONMENT: "development"
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
    depends_on:
      pamawas-migrations:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamawas-network

  pamawas-investigator:
    build:
      context: ../../pamawas-investigator
      dockerfile: Dockerfile
    container_name: pamawas-investigator
    ports:
      - "8082:8080"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-pamawas}:${POSTGRES_PASSWORD:-pamawas}@postgresql:5432/${POSTGRES_DB:-pamawas}?sslmode=disable"
      PORT: "8080"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_API_KEY: "${LLM_API_KEY}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      PROMETHEUS_URL: "http://prometheus:9090"
      LOKI_URL: "http://loki:3100"
      MAX_TOOL_CALLS: "6"
      LOG_LEVEL: "info"
      ENVIRONMENT: "development"
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
    depends_on:
      postgresql:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamawas-network

  pamawas-reporter:
    build:
      context: ../../pamawas-reporter
      dockerfile: Dockerfile
    container_name: pamawas-reporter
    ports:
      - "8083:8080"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-pamawas}:${POSTGRES_PASSWORD:-pamawas}@postgresql:5432/${POSTGRES_DB:-pamawas}?sslmode=disable"
      PORT: "8080"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
      EMAIL_SMTP_HOST: "${EMAIL_SMTP_HOST}"
      EMAIL_SMTP_PORT: "${EMAIL_SMTP_PORT:-587}"
      EMAIL_USERNAME: "${EMAIL_USERNAME}"
      EMAIL_PASSWORD: "${EMAIL_PASSWORD}"
      EMAIL_FROM: "${EMAIL_FROM}"
      EMAIL_TO: "${EMAIL_TO}"
      REPORT_INTERVAL: "1h"
      LOG_LEVEL: "info"
      ENVIRONMENT: "development"
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
    depends_on:
      postgresql:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamawas-network

  pamawas-scheduler:
    build:
      context: ../../pamawas-scheduler
      dockerfile: Dockerfile
    container_name: pamawas-scheduler
    ports:
      - "8084:8080"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-pamawas}:${POSTGRES_PASSWORD:-pamawas}@postgresql:5432/${POSTGRES_DB:-pamawas}?sslmode=disable"
      PORT: "8080"
      REPORTER_URL: "http://pamawas-reporter:8080"
      DAILY_REPORT_TIME: "07:00"
      HIGH_SEVERITY_THRESHOLD: "high"
      CHECK_INTERVAL: "30s"
      ENABLE_DAILY_REPORT: "true"
      ENABLE_HIGH_SEVERITY_ALERT: "true"
      LOG_LEVEL: "info"
      ENVIRONMENT: "development"
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
    depends_on:
      postgresql:
        condition: service_healthy
      pamawas-reporter:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamawas-network

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  grafana-data:
  tempo-data:

networks:
  pamawas-network:
    driver: bridge