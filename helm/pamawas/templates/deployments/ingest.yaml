{{- if .Values.ingest.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pamawas.fullname" . }}-ingest
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pamawas.labels" . | nindent 4 }}
    app: {{ include "pamawas.fullname" . }}-ingest
spec:
  replicas: {{ .Values.ingest.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "pamawas.fullname" . }}-ingest
  template:
    metadata:
      labels:
        app: {{ include "pamawas.fullname" . }}-ingest
        {{- include "pamawas.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.commonConfig.port }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "pamawas.serviceAccountName" . }}
      containers:
        - name: ingest
          image: "{{ .Values.global.imageRegistry }}/pamawas/pamawas-ingest:{{ .Values.ingest.image.tag }}"
          imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.commonConfig.port }}
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "pamawas.fullname" . }}-secrets
                  key: DATABASE_URL
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pamawas.fullname" . }}-config
                  key: PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pamawas.fullname" . }}-config
                  key: LOG_LEVEL
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pamawas.fullname" . }}-config
                  key: ENVIRONMENT
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pamawas.fullname" . }}-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          {{- include "pamawas.probes" (merge .Values.ingest.probes (dict "port" $.Values.commonConfig.port)) | nindent 12 }}
          resources:
            {{- toYaml .Values.ingest.resources | nindent 12 }}
      serviceAccountName: {{ include "pamawas.serviceAccountName" . }}
{{- end }}
