{{- if .Values.reporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pamawas.fullname" . }}-reporter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pamawas.labels" . | nindent 4 }}
    app: {{ include "pamawas.fullname" . }}-reporter
spec:
  replicas: {{ .Values.reporter.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "pamawas.fullname" . }}-reporter
  template:
    metadata:
      labels:
        app: {{ include "pamawas.fullname" . }}-reporter
        {{- include "pamawas.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.commonConfig.port }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "pamawas.serviceAccountName" . }}
      containers:
        - name: reporter
          image: "{{ .Values.global.imageRegistry }}/pamawas/pamawas-reporter:{{ .Values.reporter.image.tag }}"
          imagePullPolicy: {{ .Values.reporter.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.commonConfig.port }}
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "pamawas.fullname" . }}-secrets
                  key: DATABASE_URL
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pamawas.fullname" . }}-config
                  key: PORT
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "pamawas.fullname" . }}-secrets
                  key: DISCORD_WEBHOOK_URL
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pamawas.fullname" . }}-secrets
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "pamawas.fullname" . }}-secrets
                  key: TELEGRAM_CHAT_ID
            - name: EMAIL_SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "pamawas.fullname" . }}-secrets
                  key: EMAIL_SMTP_HOST
            - name: EMAIL_SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "pamawas.fullname" . }}-secrets
                  key: EMAIL_SMTP_PORT
            - name: EMAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "pamawas.fullname" . }}-secrets
                  key: EMAIL_USERNAME
            - name: EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pamawas.fullname" . }}-secrets
                  key: EMAIL_PASSWORD
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: {{ include "pamawas.fullname" . }}-secrets
                  key: EMAIL_FROM
            - name: EMAIL_TO
              valueFrom:
                secretKeyRef:
                  name: {{ include "pamawas.fullname" . }}-secrets
                  key: EMAIL_TO
            - name: REPORT_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pamawas.fullname" . }}-config
                  key: REPORT_INTERVAL
            - name: REPORTER_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pamawas.fullname" . }}-config
                  key: REPORTER_MODE
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pamawas.fullname" . }}-config
                  key: LOG_LEVEL
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pamawas.fullname" . }}-config
                  key: ENVIRONMENT
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pamawas.fullname" . }}-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: REPORT_TEMPLATE
              valueFrom:
                secretKeyRef:
                  name: {{ include "pamawas.fullname" . }}-secrets
                  key: REPORT_TEMPLATE
                  optional: true
          {{- include "pamawas.probes" (merge .Values.reporter.probes (dict "port" $.Values.commonConfig.port)) | nindent 10 }}
          resources:
            {{- toYaml .Values.reporter.resources | nindent 12 }}
{{- end }}
