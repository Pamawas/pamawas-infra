apiVersion: v1
kind: Secret
metadata:
  name: "{{ include \"pamawas.fullname\" . }}-secrets"
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "pamawas.labels" . | indent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "{{ printf \"postgres://%s:%s@%s:%d/%s?sslmode=disable\" .Values.external.postgresql.username .Values.external.postgresql.password .Values.external.postgresql.host .Values.external.postgresql.port .Values.external.postgresql.database }}"
  DISCORD_WEBHOOK_URL: "{{ .Values.delivery.discordWebhookUrl }}"
  TELEGRAM_BOT_TOKEN: "{{ .Values.delivery.telegramBotToken }}"
  TELEGRAM_CHAT_ID: "{{ .Values.delivery.telegramChatId }}"
  EMAIL_SMTP_HOST: "{{ .Values.delivery.email.smtpHost }}"
  EMAIL_SMTP_PORT: "{{ .Values.delivery.email.smtpPort }}"
  EMAIL_USERNAME: "{{ .Values.delivery.email.username }}"
  EMAIL_PASSWORD: "{{ .Values.delivery.email.password }}"
  EMAIL_FROM: "{{ .Values.delivery.email.from }}"
  EMAIL_TO: "{{ .Values.delivery.email.to }}"
  LLM_API_KEY: "{{ .Values.llm.apiKey }}"
  REPORT_TEMPLATE: "{{ .Values.delivery.reportTemplate }}"
